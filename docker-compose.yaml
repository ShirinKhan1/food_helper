services:
  db:
    image: pgvector/pgvector:pg16
    container_name: food_helper_db
    environment:
      POSTGRES_DB: food_helper
      POSTGRES_USER: food
      POSTGRES_PASSWORD: foodpass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food_helper"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: food_helper_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  model:
    build:
      context: .
      dockerfile: docker/Dockerfile.model
    container_name: food_helper_model
    environment:
      MODEL_BASE_NAME: Qwen/Qwen3-0.6B
      MODEL_ADAPTER_PATH: /opt/models/food_helper_lora_adapter
      MODEL_NAME: food-helper-qwen3-0.6b-lora
      MODEL_DEVICE: auto
      MODEL_DTYPE: auto
      MODEL_MAX_INPUT_TOKENS: "4096"
      MODEL_ENABLE_THINKING_DEFAULT: "false"
      HF_HOME: /opt/hf_cache
    volumes:
      - ./models/food_helper_lora_adapter:/opt/models/food_helper_lora_adapter:ro
      - hf_cache:/opt/hf_cache
    ports:
      - "8010:8010"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  loader:
    profiles: ["load"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: food_helper_loader
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: food_helper
      DB_USER: food
      DB_PASSWORD: foodpass
      JSONL_PATH: /data/recipes.jsonl
      BATCH_SIZE: "500"
    volumes:
      - ./recipes.jsonl:/data/recipes.jsonl:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: ["python", "scripts/ingest/load_jsonl_to_postgres.py"]

  embed:
    profiles: ["embed"]
    build:
      context: .
      dockerfile: docker/Dockerfile.embed
    container_name: food_helper
    stdin_open: true
    tty: true
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: food_helper
      DB_USER: food
      DB_PASSWORD: foodpass
      EMBED_MODEL_NAME: intfloat/multilingual-e5-small
      EMBED_MODEL_PATH: /opt/models/intfloat-multilingual-e5-small
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["sleep", "infinity"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: food_helper_api
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: food_helper
      DB_USER: food
      DB_PASSWORD: foodpass
      DEFAULT_TOP_K: "5"
      MAX_MESSAGE_CHARS: "1000"
      EMBED_MODEL_NAME: intfloat/multilingual-e5-small
      EMBED_MODEL_PATH: /opt/models/intfloat-multilingual-e5-small
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LLM_ENABLED: "true"
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen3:4b
      LLM_BASE_URL: http://ollama:11434
      LLM_TIMEOUT_SECONDS: "90"
      LLM_TEMPERATURE: "0.2"
      LLM_MAX_TOKENS: "500"
      LLM_NUM_CTX: "4096"
      LLM_THINK: "false"
      FRONTEND_ORIGIN: http://localhost:3000
      AUTH_SECRET_KEY: dev-docker-compose-change-in-production-min-32chars
      AUTH_COOKIE_SECURE: "false"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        API_PROXY_TARGET: http://api:8000
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: food_helper_web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
  hf_cache:
