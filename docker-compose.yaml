services:
  db:
    image: pgvector/pgvector:pg16
    container_name: food_helper_db
    environment:
      POSTGRES_DB: food_helper
      POSTGRES_USER: food
      POSTGRES_PASSWORD: foodpass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food_helper"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: food_helper_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  loader:
    profiles: ["load"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: food_helper_loader
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: food_helper
      DB_USER: food
      DB_PASSWORD: foodpass
      JSONL_PATH: /data/recipes.jsonl
      BATCH_SIZE: "500"
    volumes:
      - ./recipes.jsonl:/data/recipes.jsonl:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: ["python", "scripts/ingest/load_jsonl_to_postgres.py"]

  embed:
    profiles: ["embed"]
    build:
      context: .
      dockerfile: docker/Dockerfile.embed
    container_name: food_helper
    stdin_open: true
    tty: true
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: food_helper
      DB_USER: food
      DB_PASSWORD: foodpass
      EMBED_MODEL_NAME: intfloat/multilingual-e5-small
      EMBED_MODEL_PATH: /opt/models/intfloat-multilingual-e5-small
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["sleep", "infinity"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: food_helper_api
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: food_helper
      DB_USER: food
      DB_PASSWORD: foodpass
      DEFAULT_TOP_K: "5"
      MAX_MESSAGE_CHARS: "1000"
      EMBED_MODEL_NAME: intfloat/multilingual-e5-small
      EMBED_MODEL_PATH: /opt/models/intfloat-multilingual-e5-small
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LLM_ENABLED: "true"
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen3:4b
      LLM_BASE_URL: http://ollama:11434
      LLM_TIMEOUT_SECONDS: "90"
      LLM_TEMPERATURE: "0.2"
      LLM_MAX_TOKENS: "500"
      LLM_NUM_CTX: "4096"
      LLM_THINK: "false"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
